name: Refresh GitHub stats card

on:
  schedule:
    # 北京时间每天 00:17 执行
    # GitHub Actions 使用 UTC，这里 16:17 UTC = 北京时间 00:17
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      allow_decrease:
        description: "核实仓库或分支变化后，允许提交数明显下降"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-total-commits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test commit counting
        run: python -B -m unittest discover -s tests -v

      - name: Count authored commits across all owned repositories and branches
        env:
          # Classic PAT owned by TimeseekerKK: repo + read:user.
          # read:user exposes owned_private_repos for complete coverage checks.
          COMMIT_STATS_TOKEN: ${{ secrets.COMMIT_STATS_TOKEN }}
          ALLOW_DECREASE: ${{ inputs.allow_decrease == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--author-email '149032340+TobeBestKK@users.noreply.github.com')
          if [[ "$ALLOW_DECREASE" == "true" ]]; then
            args+=(--allow-decrease)
          fi
          python -B .github/scripts/count_commits.py "${args[@]}"

      - name: Commit updated stats card
        shell: bash
        run: |
          set -euo pipefail

          git add -- assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No card change is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: 更新全分支个人提交总数"
          git push
